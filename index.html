<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypto Portfolio</title>
<style>
:root{color-scheme:dark;--bg:#07090d;--panel:#0e1218;--panel2:#121821;--line:#202834;--muted:#778292;--text:#f7f9fb;--accent:#7cf6cf;--btc:#f7931a;--danger:#ff6b78}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% -10%,#17202c 0,transparent 32%),var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1100px;margin:0 auto;padding:42px 22px 70px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px}.brandmark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#1b2633,#0c1118);border:1px solid #2b3645;display:grid;place-items:center;font-size:18px}.brand h1{font-size:19px;margin:0;letter-spacing:-.02em}.status{font-size:12px;color:var(--muted);margin-top:2px}.refresh{border:1px solid var(--line);background:#10151c;color:#dfe6ee;border-radius:11px;padding:9px 13px;cursor:pointer}.refresh:hover{background:#171e27}.hero{background:linear-gradient(135deg,#121923,#0d1219);border:1px solid #25303d;border-radius:22px;padding:26px 28px;box-shadow:0 24px 80px #0005}.eyebrow{font-size:11px;font-weight:700;color:#7e8b9b;letter-spacing:.14em}.heroValue{font-size:48px;font-weight:750;letter-spacing:-.045em;margin:8px 0 5px}.heroSub{font-size:17px;color:#929eac}.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.card{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:20px}.assetHead{display:flex;align-items:center;justify-content:space-between}.assetName{display:flex;align-items:center;gap:11px;font-weight:700;font-size:15px}.coin{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800}.btcCoin{background:var(--btc);color:white;font-size:20px}.hlCoin{background:#061c19;color:var(--accent);border:1px solid #17433b;font-size:17px}.value{font-size:27px;font-weight:700;letter-spacing:-.025em;margin-top:18px}.secondary{color:var(--muted);margin-top:4px;font-size:13px}.section{margin-top:14px}.sectionTitle{font-size:13px;font-weight:700;margin-bottom:15px}.form{display:grid;grid-template-columns:1fr 2fr auto;gap:8px}input,button{font:inherit}input{width:100%;background:#090d12;border:1px solid #202936;border-radius:10px;color:var(--text);padding:10px 12px;outline:none}input:focus{border-color:#3c4d61}button.action{background:#e9eef4;color:#0a0d11;border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer}.row{display:grid;grid-template-columns:1.2fr 1.7fr 1fr auto;align-items:center;gap:12px;padding:14px 2px;border-top:1px solid #1c242e}.row:first-child{margin-top:14px}.addr{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);overflow:hidden;text-overflow:ellipsis}.right{text-align:right;font-variant-numeric:tabular-nums}.remove{border:0;background:transparent;color:#596574;font-size:18px;cursor:pointer}.remove:hover{color:var(--danger)}.positions{margin-top:12px}.pos{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;padding:11px 2px;border-top:1px solid #1c242e;font-size:13px}.error{color:var(--danger);margin-top:10px}.footer{margin-top:18px;color:#566170;font-size:11px;text-align:right}@media(max-width:720px){main{padding:24px 14px 50px}.heroValue{font-size:38px}.cards{grid-template-columns:1fr}.form{grid-template-columns:1fr}.row{grid-template-columns:1fr auto}.row .addr{grid-column:1/-1}.pos{grid-template-columns:1fr 1fr}}
</style></head><body><main>
<div class="top"><div class="brand"><div class="brandmark">◈</div><div><h1>Portfolio</h1><div class="status">Personal crypto dashboard</div></div></div><button class="refresh" onclick="refreshAll()">↻ Refresh</button></div>
<section class="hero"><div class="eyebrow">TOTAL NET WORTH</div><div class="heroValue" id="netUsd">—</div><div class="heroSub" id="netEur">—</div></section>
<div class="cards"><section class="card"><div class="assetHead"><div class="assetName"><div class="coin btcCoin">₿</div>Bitcoin</div><span class="secondary" id="btcUsd">—</span></div><div class="value" id="btcTotal">—</div></section><section class="card"><div class="assetHead"><div class="assetName"><div class="coin hlCoin">HL</div>Hyperliquid</div></div><div class="value" id="hlTotal">—</div></section></div>
<section class="card section"><div class="sectionTitle">Bitcoin wallets</div><div class="form"><input id="btcLabel" placeholder="Label"><input id="btcAddr" placeholder="bc1p…"><button class="action" onclick="addBTC()">Add</button></div><div id="btcRows"></div><div class="error" id="btcErr"></div></section>
<section class="card section"><div class="sectionTitle">Hyperliquid account</div><div class="form"><input id="hlLabel" placeholder="Label"><input id="hlAddr" placeholder="0x…"><button class="action" onclick="saveHL()">Save</button></div><div id="hlRows"></div><div class="positions" id="positions"></div><div class="error" id="hlErr"></div></section>
<div class="footer"><span id="fxRate"></span> · Updated <span id="updated">—</span></div>
</main><script>
const K='crypto-monitor-v1';let cfg=JSON.parse(localStorage.getItem(K)||'null')||{btc:[],hl:{label:'Hyperliquid',address:''}};const $=id=>document.getElementById(id),save=()=>localStorage.setItem(K,JSON.stringify(cfg));let valuation={btcUsd:0,hlUsd:0,usdEur:0};function short(a){return a?`${a.slice(0,9)}…${a.slice(-7)}`:'—'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){$('hlLabel').value=cfg.hl.label||'';$('hlAddr').value=cfg.hl.address||'';$('btcRows').innerHTML=cfg.btc.map((w,i)=>`<div class="row"><b>${esc(w.label||'BTC')}</b><span class="addr">${esc(short(w.address))}</span><span class="right" id="b${i}">—</span><button class="remove" onclick="delBTC(${i})">×</button></div>`).join('');$('hlRows').innerHTML=cfg.hl.address?`<div class="row"><b>${esc(cfg.hl.label||'Hyperliquid')}</b><span class="addr">${esc(short(cfg.hl.address))}</span><span class="right" id="hls">—</span><span></span></div>`:''}
function addBTC(){let a=$('btcAddr').value.trim();if(!a)return;cfg.btc.push({label:$('btcLabel').value.trim()||'BTC',address:a});save();$('btcAddr').value='';render();refreshAll()}function delBTC(i){cfg.btc.splice(i,1);save();render();refreshAll()}function saveHL(){cfg.hl={label:$('hlLabel').value.trim()||'Hyperliquid',address:$('hlAddr').value.trim()};save();render();refreshAll()}
async function refreshBTC(){$('btcErr').textContent='';let total=0;for(let i=0;i<cfg.btc.length;i++)try{let r=await fetch(`https://mempool.space/api/address/${encodeURIComponent(cfg.btc[i].address)}`);if(!r.ok)throw Error(`${r.status} ${r.statusText}`);let d=await r.json(),c=d.chain_stats||{},m=d.mempool_stats||{};let sats=(c.funded_txo_sum-c.spent_txo_sum)+(m.funded_txo_sum-m.spent_txo_sum),btc=sats/1e8;total+=btc;$(`b${i}`).textContent=btc.toLocaleString(undefined,{maximumFractionDigits:8})+' BTC'}catch(e){$(`b${i}`).textContent='error';$('btcErr').textContent=`BTC: ${e.message}`}$('btcTotal').textContent=total.toLocaleString(undefined,{maximumFractionDigits:8})+' BTC';try{let pr=await fetch('https://mempool.space/api/v1/prices');if(pr.ok){let pd=await pr.json(),usd=Number(pd.USD||0);valuation.btcUsd=total*usd;$('btcUsd').textContent=usd?'$'+valuation.btcUsd.toLocaleString(undefined,{maximumFractionDigits:0}):'—'}}catch(_){$('btcUsd').textContent='—'}}
async function refreshHL(){$('hlErr').textContent='';$('positions').innerHTML='';if(!cfg.hl.address){valuation.hlUsd=0;$('hlTotal').textContent='—';return}try{let [portfolioRes,stateRes]=await Promise.all([fetch('https://api.hyperliquid.xyz/info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'portfolio',user:cfg.hl.address})}),fetch('https://api.hyperliquid.xyz/info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'clearinghouseState',user:cfg.hl.address})})]);if(!portfolioRes.ok)throw Error(`portfolio: ${portfolioRes.status}`);let portfolio=await portfolioRes.json(),dayEntry=(portfolio||[]).find(x=>x?.[0]==='day'),hist=dayEntry?.[1]?.accountValueHistory||[],last=hist.length?hist[hist.length-1]:null,v=Number(last?.[1]);if(!Number.isFinite(v))throw Error('Total Equity unavailable');valuation.hlUsd=v;$('hlTotal').textContent='$'+v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});if($('hls'))$('hls').textContent='$'+v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});if(stateRes.ok){let d=await stateRes.json(),ps=(d.assetPositions||[]).map(x=>x.position).filter(Boolean);$('positions').innerHTML=ps.length?ps.map(p=>`<div class="pos"><b>${esc(p.coin)}</b><span>${Number(p.szi)>0?'LONG':'SHORT'} ${esc(p.szi)}</span><span>Entry ${esc(p.entryPx||'—')}</span><span class="right">${Number(p.unrealizedPnl||0)>=0?'+':''}$${Number(p.unrealizedPnl||0).toFixed(2)}</span></div>`).join(''):''}}catch(e){valuation.hlUsd=0;$('hlTotal').textContent='error';$('hlErr').textContent=e.message}}
async function refreshFX(){try{let r=await fetch('https://api.frankfurter.app/latest?from=EUR&to=USD');if(!r.ok)throw Error();let d=await r.json(),eurUsd=Number(d.rates?.USD||0);if(!eurUsd)throw Error();valuation.usdEur=1/eurUsd;$('fxRate').textContent=`USD/EUR ${valuation.usdEur.toFixed(4)}`}catch(e){try{let r=await fetch('https://open.er-api.com/v6/latest/USD'),d=await r.json();valuation.usdEur=Number(d.rates?.EUR||0);$('fxRate').textContent=valuation.usdEur?`USD/EUR ${valuation.usdEur.toFixed(4)}`:''}catch(_){valuation.usdEur=0;$('fxRate').textContent=''}}}
function renderNetWorth(){let usd=valuation.btcUsd+valuation.hlUsd;$('netUsd').textContent='$'+usd.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});$('netEur').textContent=valuation.usdEur?'€'+(usd*valuation.usdEur).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):'—'}async function refreshAll(){await Promise.all([refreshBTC(),refreshHL(),refreshFX()]);renderNetWorth();$('updated').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}render();refreshAll();
</script></body></html>
