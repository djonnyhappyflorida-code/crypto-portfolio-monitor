<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crypto Portfolio Monitor</title>
<style>
:root{color-scheme:dark;--bg:#0b0d10;--card:#13171c;--line:#262c34;--muted:#8d98a5;--text:#f4f7fa;--good:#63d297;--bad:#ff7777}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:960px;margin:42px auto;padding:0 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:20px;margin:0}.muted{color:var(--muted)}button,input{background:#181d23;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.big{font-size:28px;font-weight:700;margin-top:7px}.section{margin-top:14px}.row{display:grid;grid-template-columns:1.3fr 1.7fr 1fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.addr{font-family:ui-monospace,monospace;color:var(--muted);overflow:hidden;text-overflow:ellipsis}.right{text-align:right}.form{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;margin-top:12px}.err{color:var(--bad);white-space:pre-wrap;margin-top:10px}.pos{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;padding:9px 0;border-top:1px solid var(--line)}@media(max-width:700px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr auto}.row .addr{grid-column:1/-1}.form{grid-template-columns:1fr}.pos{grid-template-columns:1fr 1fr}}
</style></head><body><main>
<div class="top"><h1>Portfolio Monitor</h1><button onclick="refreshAll()">↻ Refresh</button></div>
<div class="grid"><div class="card"><div class="muted">NET WORTH · USD</div><div class="big" id="netUsd">—</div></div><div class="card"><div class="muted">NET WORTH · EUR</div><div class="big" id="netEur">—</div><div class="muted" id="fxRate">—</div></div><div class="card"><div class="muted">BTC</div><div class="big" id="btcTotal">—</div><div class="muted" id="btcUsd">—</div></div></div>
<div class="grid"><div class="card"><div class="muted">Hyperliquid</div><div class="big" id="hlTotal">—</div></div><div class="card"><div class="muted">Dernier refresh</div><div class="big" id="updated">—</div></div></div>
<div class="card section"><b>Bitcoin</b><div class="form"><input id="btcLabel" placeholder="Label"><input id="btcAddr" placeholder="bc1p..."><button onclick="addBTC()">+ Add</button></div><div id="btcRows"></div><div class="err" id="btcErr"></div></div>
<div class="card section"><b>Hyperliquid</b><div class="form"><input id="hlLabel" placeholder="Label"><input id="hlAddr" placeholder="0x..."><button onclick="saveHL()">Save</button></div><div id="hlRows"></div><div id="positions"></div><div class="err" id="hlErr"></div></div>
</main><script>
const K='crypto-monitor-v1';let cfg=JSON.parse(localStorage.getItem(K)||'null')||{btc:[],hl:{label:'Hyperliquid',address:''}};const $=id=>document.getElementById(id),save=()=>localStorage.setItem(K,JSON.stringify(cfg));let valuation={btcUsd:0,hlUsd:0,usdEur:0};
function short(a){return a?`${a.slice(0,9)}…${a.slice(-7)}`:'—'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){$('hlLabel').value=cfg.hl.label||'';$('hlAddr').value=cfg.hl.address||'';$('btcRows').innerHTML=cfg.btc.map((w,i)=>`<div class="row"><b>${esc(w.label||'BTC')}</b><span class="addr">${esc(short(w.address))}</span><span class="right" id="b${i}">—</span><button onclick="delBTC(${i})">×</button></div>`).join('');$('hlRows').innerHTML=cfg.hl.address?`<div class="row"><b>${esc(cfg.hl.label||'Hyperliquid')}</b><span class="addr">${esc(short(cfg.hl.address))}</span><span class="right" id="hls">—</span></div>`:''}
function addBTC(){let a=$('btcAddr').value.trim();if(!a)return;cfg.btc.push({label:$('btcLabel').value.trim()||'BTC',address:a});save();$('btcAddr').value='';render();refreshAll()}function delBTC(i){cfg.btc.splice(i,1);save();render();refreshAll()}function saveHL(){cfg.hl={label:$('hlLabel').value.trim()||'Hyperliquid',address:$('hlAddr').value.trim()};save();render();refreshAll()}
async function refreshBTC(){$('btcErr').textContent='';let total=0;for(let i=0;i<cfg.btc.length;i++)try{let r=await fetch(`https://mempool.space/api/address/${encodeURIComponent(cfg.btc[i].address)}`);if(!r.ok)throw Error(`${r.status} ${r.statusText}`);let d=await r.json(),c=d.chain_stats||{},m=d.mempool_stats||{};let sats=(c.funded_txo_sum-c.spent_txo_sum)+(m.funded_txo_sum-m.spent_txo_sum),btc=sats/1e8;total+=btc;$(`b${i}`).textContent=btc.toLocaleString(undefined,{maximumFractionDigits:8})+' BTC'}catch(e){$(`b${i}`).textContent='error';$('btcErr').textContent=`BTC: ${e.message}`}$('btcTotal').textContent=total.toLocaleString(undefined,{maximumFractionDigits:8})+' BTC';try{let pr=await fetch('https://mempool.space/api/v1/prices');if(pr.ok){let pd=await pr.json(),usd=Number(pd.USD||0);valuation.btcUsd=total*usd;$('btcUsd').textContent=usd?'≈ $'+valuation.btcUsd.toLocaleString(undefined,{maximumFractionDigits:2})+' · BTC $'+usd.toLocaleString():'—'}}catch(_){$('btcUsd').textContent='prix indisponible'}}
async function refreshHL(){$('hlErr').textContent='';$('positions').innerHTML='';if(!cfg.hl.address){valuation.hlUsd=0;$('hlTotal').textContent='—';return}try{let [portfolioRes,stateRes]=await Promise.all([fetch('https://api.hyperliquid.xyz/info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'portfolio',user:cfg.hl.address})}),fetch('https://api.hyperliquid.xyz/info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'clearinghouseState',user:cfg.hl.address})})]);if(!portfolioRes.ok)throw Error(`portfolio: ${portfolioRes.status} ${portfolioRes.statusText}`);let portfolio=await portfolioRes.json();let dayEntry=(portfolio||[]).find(x=>x?.[0]==='day');let hist=dayEntry?.[1]?.accountValueHistory||[];let last=hist.length?hist[hist.length-1]:null;let v=Number(last?.[1]);if(!Number.isFinite(v))throw Error('Total Equity indisponible dans portfolio');valuation.hlUsd=v;$('hlTotal').textContent='$'+v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});if($('hls'))$('hls').textContent='$'+v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});if(stateRes.ok){let d=await stateRes.json();let ps=(d.assetPositions||[]).map(x=>x.position).filter(Boolean);$('positions').innerHTML=ps.length?'<div class="muted" style="margin-top:14px">Open positions</div>'+ps.map(p=>`<div class="pos"><b>${esc(p.coin)}</b><span>${Number(p.szi)>0?'LONG':'SHORT'} ${esc(p.szi)}</span><span>Entry ${esc(p.entryPx||'—')}</span><span class="right">uPnL ${Number(p.unrealizedPnl||0).toFixed(2)}</span></div>`).join(''):''}}catch(e){valuation.hlUsd=0;$('hlTotal').textContent='error';$('hlErr').textContent='Hyperliquid Total Equity: '+e.message}}
async function refreshFX(){try{let r=await fetch('https://api.frankfurter.app/latest?from=EUR&to=USD');if(!r.ok)throw Error(`${r.status} ${r.statusText}`);let d=await r.json();let eurUsd=Number(d.rates?.USD||0);if(!Number.isFinite(eurUsd)||eurUsd<=0)throw Error('taux USD/EUR invalide');valuation.usdEur=1/eurUsd;$('fxRate').textContent=`1 USD = ${valuation.usdEur.toFixed(4)} EUR`}catch(e){try{let r2=await fetch('https://open.er-api.com/v6/latest/USD');if(!r2.ok)throw Error(`${r2.status} ${r2.statusText}`);let d2=await r2.json();let rate=Number(d2.rates?.EUR||0);if(!Number.isFinite(rate)||rate<=0)throw Error('taux EUR invalide');valuation.usdEur=rate;$('fxRate').textContent=`1 USD = ${rate.toFixed(4)} EUR`}catch(_){valuation.usdEur=0;$('fxRate').textContent='taux EUR indisponible'}}}
function renderNetWorth(){let usd=valuation.btcUsd+valuation.hlUsd;$('netUsd').textContent='$'+usd.toLocaleString(undefined,{maximumFractionDigits:2});$('netEur').textContent=valuation.usdEur?'€'+(usd*valuation.usdEur).toLocaleString(undefined,{maximumFractionDigits:2}):'—'}async function refreshAll(){await Promise.all([refreshBTC(),refreshHL(),refreshFX()]);renderNetWorth();$('updated').textContent=new Date().toLocaleTimeString()}render();refreshAll();
</script></body></html>
